openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dienstplan-App API für Persönliche Assistenz
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Benutzer und Rollen
  - name: contracts
    description: Verträge und Konditionen
  - name: shifts
    description: Dienstplan und Schichten
  - name: time-tracking
    description: Zeiterfassung
  - name: dashboard
    description: Dashboard-Übersicht
  - name: invitations
    description: Team-Einladungen
  - name: auth
    description: Authentifizierung
  - name: branding-settings
    description: Firmenlogo und Branding
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: operator
    description: Betreiber-Konsole (nur superadmin)
  - name: month-closings
    description: Monatsabschluss der Lohnauswertung mit Nachberechnung
  - name: hour-budgets
    description: Zielvereinbarungen (genehmigte Assistenzstunden pro Monat, Bedarfsseite)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Alle Benutzer auflisten
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, assistant]
        - name: teamId
          in: query
          description: Optionaler Team-Kontext; schränkt auf Mitglieder dieses Teams ein.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Benutzer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Neuen Benutzer anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Benutzer abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Nicht gefunden
    patch:
      operationId: updateUser
      tags: [users]
      summary: Benutzer aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Benutzer löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht

  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: Alle Verträge auflisten
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Verträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Vertrag anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Vertrag abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vertrag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: Nicht gefunden
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Vertrag aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Vertrag löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht

  /hour-budgets:
    get:
      operationId: listHourBudgets
      tags: [hour-budgets]
      summary: Zielvereinbarungen (Monatsbudgets) auflisten — Premium advancedAnalytics
      parameters:
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Zielvereinbarungen (nach Beginn sortiert)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HourBudget"
        "403":
          description: Premium-Tarif erforderlich (plan_feature_required)
    post:
      operationId: createHourBudget
      tags: [hour-budgets]
      summary: Zielvereinbarung anlegen — Premium advancedAnalytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HourBudgetInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HourBudget"
        "403":
          description: Premium-Tarif erforderlich (plan_feature_required)
        "409":
          description: >-
            Konflikt: Der Zeitraum überlappt eine bestehende Zielvereinbarung
            desselben Teams (code "budget_overlap").

  /hour-budgets/{id}:
    patch:
      operationId: updateHourBudget
      tags: [hour-budgets]
      summary: Zielvereinbarung ändern — Premium advancedAnalytics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HourBudgetUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HourBudget"
        "404":
          description: Nicht gefunden
        "409":
          description: >-
            Konflikt: Der Zeitraum überlappt eine andere Zielvereinbarung
            desselben Teams (code "budget_overlap").
    delete:
      operationId: deleteHourBudget
      tags: [hour-budgets]
      summary: Zielvereinbarung löschen — Premium advancedAnalytics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht
        "404":
          description: Nicht gefunden

  /shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: Schichten auflisten
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [active, standby, night, full_day, vacation, sick, work, freizeitausgleich, team, kind_krank, freistellung, abgesagt_ag, abgesagt_an, urlaubsabgeltung]
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Schichten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Schicht anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          description: >-
            Ungültige Anfrage. U. a. wenn ein Urlaub außerhalb jedes
            Vertragszeitraums der Assistenzkraft liegt (code
            "vacation_outside_contract") — Nutzer ganz ohne Vertrag bleiben
            unbeschränkt.
        "409":
          description: >-
            Konflikt. Entweder überschneidet sich die Schicht mit einer
            bestehenden Schicht desselben Assistenten (code "shift_overlap"),
            oder es existiert bereits eine Abwesenheit desselben Typs am selben
            Tag (code "absence_duplicate"). Im zweiten Fall wird kein Eintrag
            angelegt und der Urlaubsanspruch nicht erneut belastet.

  /shifts/bulk-absence:
    post:
      operationId: bulkCreateAbsence
      tags: [shifts]
      summary: Abwesenheits-Zeitraum als Sammelauftrag anlegen
      description: >-
        Legt mehrere Abwesenheits-Tage derselben Art für eine Assistenzkraft
        transaktional in EINEM Request an (ganz oder gar nicht). Tage mit
        bereits vorhandener Abwesenheit desselben Typs werden übersprungen und
        gemeldet statt mit 409 abzubrechen. Der Urlaubszähler wird einmal am
        Ende fortgeschrieben, nicht pro Tag. Es gelten dieselben Regeln wie
        beim Einzel-Anlegen (Team-Scope, Selbstservice nur für eigene
        Abwesenheiten, Ersetzung geplanter Dienste am Abwesenheitstag,
        Vertragszeitraum-Guard für Urlaub, Vorausplanungs-Limit).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkAbsenceInput"
      responses:
        "201":
          description: >-
            Zeitraum angelegt (ggf. mit übersprungenen Duplikat-Tagen). Bei
            createdCount 0 bestanden an allen Tagen bereits Abwesenheiten
            dieses Typs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkAbsenceResult"
        "400":
          description: >-
            Ungültige Anfrage. U. a. wenn ein Urlaubstag außerhalb jedes
            Vertragszeitraums der Assistenzkraft liegt (code
            "vacation_outside_contract") — dann wird KEIN Tag angelegt.
        "403":
          description: Keine Berechtigung (fremde Person oder fremdes Team).

  /shifts/{id}:
    get:
      operationId: getShift
      tags: [shifts]
      summary: Schicht abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Schicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "404":
          description: Nicht gefunden
    patch:
      operationId: updateShift
      tags: [shifts]
      summary: Schicht aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "400":
          description: >-
            Ungültige Anfrage. U. a. wenn ein Urlaub per Datums-Änderung aus
            jedem Vertragszeitraum der Assistenzkraft herausgeschoben würde
            (code "vacation_outside_contract").
    delete:
      operationId: deleteShift
      tags: [shifts]
      summary: Schicht löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht

  /shift-models:
    get:
      operationId: listShiftModels
      tags: [shift-models]
      summary: Schichtmodelle auflisten
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Schichtmodelle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftModel"
    post:
      operationId: createShiftModel
      tags: [shift-models]
      summary: Schichtmodell anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftModelInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftModel"

  /shift-models/{id}:
    patch:
      operationId: updateShiftModel
      tags: [shift-models]
      summary: Schichtmodell aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftModelUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftModel"
        "404":
          description: Nicht gefunden
    delete:
      operationId: deleteShiftModel
      tags: [shift-models]
      summary: Schichtmodell löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht
        "404":
          description: Nicht gefunden

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: Teams auflisten
      responses:
        "200":
          description: Liste der Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Team anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Team aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Nicht gefunden
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Team löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht
        "404":
          description: Nicht gefunden
        "409":
          description: Team enthält noch Daten oder Mitglieder

  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: Team-Mitglieder auflisten
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Mitglieder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "404":
          description: Team nicht gefunden
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Mitglied zum Team hinzufügen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Hinzugefügt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Team oder Benutzer nicht gefunden
        "409":
          description: Benutzer ist bereits Mitglied

  /teams/{id}/members/{userId}:
    patch:
      operationId: updateTeamMemberFlags
      tags: [teams]
      summary: Teamleiter-Flag und Lohndaten-Sichtbarkeit setzen
      description: >-
        Setzt isTeamleiter und/oder canViewPayroll für ein Team-Mitglied.
        Nur Konto-Admins (Eigentümer) dürfen diese Flags ändern.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberFlagsInput"
      responses:
        "200":
          description: Aktualisiertes Mitglied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          description: Ungültige Anfrage
        "403":
          description: Keine Berechtigung
        "404":
          description: Mitgliedschaft nicht gefunden
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Mitglied aus Team entfernen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Entfernt
        "404":
          description: Nicht gefunden

  /teams/{id}/members/{userId}/move:
    post:
      operationId: moveTeamMember
      tags: [teams]
      summary: Mitglied atomar in ein anderes Team überführen
      description: >-
        Entfernt die Mitgliedschaft im Quell-Team, legt sie im Ziel-Team an und
        verschiebt die persönlichen Daten der Person (Verträge, Schichten,
        Zeiteinträge) aus dem Quell- ins Ziel-Team mit — atomar in EINER
        Transaktion. Schichten verlieren dabei ihre Schichtmodell-Zuordnung
        (Modelle gehören zum Quell-Team). Quell- und Ziel-Team müssen dem
        Aufrufer gehören.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberMoveInput"
      responses:
        "200":
          description: Überführt (neue Mitgliedschaft im Ziel-Team)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Team, Ziel-Team oder Mitgliedschaft nicht gefunden
        "409":
          description: Benutzer ist bereits Mitglied des Ziel-Teams

  /allowance-settings:
    get:
      operationId: getAllowanceSettings
      tags: [allowance-settings]
      summary: Zuschlags-Einstellungen lesen
      parameters:
        - name: teamId
          in: query
          description: Optionaler Team-Kontext; liefert den Team-Override, sonst (isOverride=false) die Konto-Einstellungen des Eigentümers. Nur eigene Teams erlaubt.
          schema:
            type: integer
      responses:
        "200":
          description: Zuschlags-Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceSettings"
        "403":
          description: Fremdes Team
    put:
      operationId: updateAllowanceSettings
      tags: [allowance-settings]
      summary: Zuschlags-Einstellungen aktualisieren
      parameters:
        - name: teamId
          in: query
          description: Optionaler Team-Kontext; legt einen Team-Override an bzw. aktualisiert ihn. Nur eigene Teams erlaubt.
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceSettingsInput"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceSettings"
        "403":
          description: Fremdes Team
    delete:
      operationId: deleteAllowanceSettingsOverride
      tags: [allowance-settings]
      summary: Team-Override der Zuschlags-Einstellungen entfernen (zurück auf Konto-Einstellungen)
      parameters:
        - name: teamId
          in: query
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Entfernt (oder war nicht vorhanden)
        "403":
          description: Fremdes Team

  /branding-settings:
    get:
      operationId: getBrandingSettings
      tags: [branding-settings]
      summary: Branding-Einstellungen (Firmenlogo) lesen
      parameters:
        - name: teamId
          in: query
          description: Optionaler Team-Kontext; liest das teamspezifische Logo statt des globalen.
          schema:
            type: integer
      responses:
        "200":
          description: Branding-Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingSettings"
        "403":
          description: Kein Zugriff auf dieses Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: updateBrandingSettings
      tags: [branding-settings]
      summary: Branding-Einstellungen (Firmenlogo) aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingSettingsInput"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingSettings"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Kein Zugriff auf dieses Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

