        defaultWeekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        compensationType:
          type: string
          enum: [regular, percentage, flat]
        compensationPercent:
          type: ["integer", "null"]
          minimum: 0
        compensationFlatCents:
          type: ["integer", "null"]
          minimum: 0

    ShiftModelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        valuationPercent:
          type: integer
          minimum: 0
        color:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean
        defaultStartTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        defaultEndTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        defaultWeekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7
        compensationType:
          type: string
          enum: [regular, percentage, flat]
        compensationPercent:
          type: ["integer", "null"]
          minimum: 0
        compensationFlatCents:
          type: ["integer", "null"]
          minimum: 0

    AllowanceSettings:
      type: object
      required:
        [
          id,
          nightPercent,
          nightStart,
          nightEnd,
          sundayPercent,
          holidayPercent,
          autoApproveTimesheets,
          timeTrackingEnabled,
          vacationMethod,
          vacationHoursPerDay,
          vacationFactor,
          ersatzruhetagEnabled,
          teamMeetingEnabled,
          teamMeetingHours,
          pauseAutoEnabled,
          pauseThreshold1Hours,
          pauseMinutes1,
          pauseThreshold2Hours,
          pauseMinutes2,
          deductPausesEnabled,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        teamId:
          type: ["integer", "null"]
          description: Team-ID des Overrides oder null bei Konto-Einstellungen.
        isOverride:
          type: boolean
          description: true, wenn für das angefragte Team ein eigener Override existiert.
        nightPercent:
          type: integer
        nightStart:
          type: string
        nightEnd:
          type: string
        sundayPercent:
          type: integer
        holidayPercent:
          type: integer
        state:
          type: ["string", "null"]
          enum: [BW, BY, BE, BB, HB, HH, HE, MV, NI, NW, RP, SL, SN, ST, SH, TH, null]
        billingMethod:
          type: ["string", "null"]
          enum: [SOLL, IST, null]
          description: Abrechnungsart auf Team- bzw. Konto-Ebene; null = erbt.
        autoApproveTimesheets:
          type: boolean
          description: Eingereichte Zeiteinträge automatisch genehmigen.
        timeTrackingEnabled:
          type: boolean
          description: >-
            Zeiterfassung (IST-Zeiten) aktiv? Konto-global (kein Team-Override);
            Standard AUS. Bei AUS blocken die Zeiterfassungs-Schreibrouten mit
            403 (code time_tracking_disabled), Lesen bleibt erlaubt.
        vacationMethod:
          type: string
          enum: [bwavg, factor]
          description: Urlaubs-Berechnung — bwavg = §11 BUrlG 13-Wochen-Schnitt, factor = prozentualer Stunden-Faktor.
        vacationHoursPerDay:
          type: number
          description: Stunden je Urlaubstag (Anzeige Tage = Stunden / diesem Wert).
        vacationFactor:
          type: number
          description: Urlaubsstunden je Arbeitsstunde bei vacationMethod=factor.
        ersatzruhetagEnabled:
          type: boolean
          description: >-
            Ersatzruhetag-Konto (§ 11 Abs. 3 ArbZG) aktiv? Bei false verdient
            Feiertagsarbeit keinen Ausgleichs-Ruhetag.
        teamMeetingEnabled:
          type: boolean
          description: >-
            Team-Dienst (Teamsitzung) aktiv? Konto-global (kein Team-Override);
            Standard AUS. Bei AUS lehnen POST/PATCH /shifts den Typ team mit
            400 ab; bestehende Team-Einträge bleiben sichtbar (Bestandsschutz).
        teamMeetingHours:
          type: number
          description: >-
            Gutgeschriebene Stunden je Teamsitzung und Assistenzkraft
            (Konto-global, Standard 1,0).
        pauseAutoEnabled:
          type: boolean
          description: >-
            Automatische Pausen-Vorbefüllung aktiv? Konto-global (kein
            Team-Override); Standard AUS. Bei AN befüllt der Schicht-Dialog
            die unbezahlte Pause neuer Dienste anhand der Dienstdauer vor
            (überschreibbar); bestehende Dienste bleiben unverändert.
        pauseThreshold1Hours:
          type: number
          description: Ab dieser Dienstdauer (Stunden) gilt Pausen-Stufe 1 (Standard 6).
        pauseMinutes1:
          type: integer
          description: Pausenminuten der Stufe 1 (Standard 30).
        pauseThreshold2Hours:
          type: number
          description: Ab dieser Dienstdauer (Stunden) gilt Pausen-Stufe 2 (Standard 9).
        pauseMinutes2:
          type: integer
          description: Pausenminuten der Stufe 2 (Standard 45).
        deductPausesEnabled:
          type: boolean
          description: >-
            Pausen von den bezahlten Stunden abziehen? Konto-global (kein
            Team-Override); Standard AUS. Bei AN reduzieren die unbezahlten
            Pausenminuten die gewerteten Stunden und den Grundlohn der
            Arbeitsdienste in BEIDEN Abrechnungsarten (zur Lesezeit angewandt);
            Zuschlagsstunden bleiben unberührt.
        updatedAt:
          type: string
          format: date-time

    AllowanceSettingsInput:
      type: object
      required: [nightPercent, nightStart, nightEnd, sundayPercent, holidayPercent]
      properties:
        nightPercent:
          type: integer
          minimum: 0
          maximum: 100
        nightStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        nightEnd:
