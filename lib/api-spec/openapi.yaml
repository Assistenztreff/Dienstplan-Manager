        compensationPercent:
          type: ["integer", "null"]
          description: Prozentsatz des Stundenlohns bei compensationType=percentage.
        compensationFlatCents:
          type: ["integer", "null"]
          description: Festbetrag pro Schicht in Cent bei compensationType=flat.
        createdAt:
          type: string
          format: date-time

    ShiftModelInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        teamId:
          type: integer
