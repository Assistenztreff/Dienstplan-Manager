          type: string

    DashboardSummary:
      type: object
      required: [totalAssistants, activeShiftsToday, pendingTimeEntries, monthlyPlannedHours, monthlyActualHours, timeTrackingEnabled]
      properties:
        timeTrackingEnabled:
          type: boolean
          description: >-
            Effektiver Zustand des Konto-Schalters „Zeiterfassung aktivieren"
            (Admin: eigener Team-Scope; Assistent: Zustand des Arbeitgebers).
            Bei false liefert das Dashboard KEINE Zeiterfassungs-Kennzahlen:
            pendingTimeEntries/uncountedPending* sind 0, recentTimeEntries ist
            leer und monthlyActualHours zeigt die geplanten FIX-Stunden
            (planbasiert).
        totalAssistants:
          type: integer
        activeShiftsToday:
          type: integer
        pendingTimeEntries:
          type: integer
        monthlyPlannedHours:
          type: number
        monthlyActualHours:
          type: number
        hoursBalance:
          type: number
        uncountedPendingHours:
          type: number
          description: >-
            Summe der Ist-Stunden offener (pending) Einträge im Monat, die wegen
            strikter Zählung (Premium-Team-Eigentümer) NICHT in monthlyActualHours
            einfließen. In Free-Teams zählen offene Einträge mit, dort ist der
            Wert 0. Nach einem Upgrade macht dieser Wert sichtbar, welche zuvor
            gezählten Stunden erst nach Bestätigung wieder erscheinen.
        uncountedPendingEntries:
          type: integer
          description: Anzahl der offenen Einträge hinter uncountedPendingHours.
        upcomingShifts:
          type: array
          items:
            $ref: "#/components/schemas/Shift"
        recentTimeEntries:
          type: array
          items:
            $ref: "#/components/schemas/TimeEntry"
        warnings:
          $ref: "#/components/schemas/DashboardWarnings"

    DashboardWarnings:
      type: object
      required: [pendingTimeEntries, timeTrackingConfirmable, lowVacationAssistants, uncoveredDays, lowVacationThreshold, horizonDays]
      properties:
        pendingTimeEntries:
          type: integer
          description: Anzahl noch nicht bestätigter Zeiterfassungen
        timeTrackingConfirmable:
          type: boolean
          description: >-
            Ob im aktuellen Team-Scope überhaupt ein Freigabe-Workflow existiert
            (mindestens ein Team mit strictTimeTracking, d. h. Premium-Eigentümer).
            Bei false ist "offen" der Normalzustand (Free) — das Frontend zeigt
            offene Zeiterfassungen dann nicht als To-do-Warnung an.
        lowVacationAssistants:
          type: array
          items:
            $ref: "#/components/schemas/LowVacationAssistant"
        uncoveredDays:
          type: array
          description: Kommende Tage ohne geplante Schicht (ISO-Datum)
          items:
            type: string
            format: date
        lowVacationThreshold:
          type: integer
          description: Schwelle (Resturlaubstage), ab der gewarnt wird
        horizonDays:
          type: integer
          description: Vorausschau-Zeitraum in Tagen für unbesetzte Tage

    LowVacationAssistant:
      type: object
      required: [userId, userName, vacationDaysRemaining]
      properties:
        userId:
          type: integer
        userName:
          type: string
        vacationDaysRemaining:
          type: number
          description: Resturlaub in Tagen, abgeleitet aus vacationHoursUsed / hoursPerDay (kann Nachkommastellen haben).

    HoursBalance:
      type: object
      required: [userId, userName, plannedHours, actualHours, balance, workedHours, sickHours, vacationDaysTaken, vacationDaysUsed, vacationDaysRemaining, valuedHours, vacationFulfilledHours, totalFulfilledHours, nightHours, nightSurchargeHours, sundayHours, sundaySurchargeHours, holidayHours, holidaySurchargeHours, nightPercent, sundayPercent, holidayPercent, billingMethod]
      properties:
        userId:
          type: integer
        userName:
          type: string
        plannedHours:
          type: number
        actualHours:
          type: number
        balance:
          type: number
        workedHours:
          type: number
        sickHours:
          type: number
        vacationDaysTaken:
          type: integer
          description: Genommene Urlaubstage des gewählten Monats (Anzahl der Urlaubs-Schichten in diesem Monat).
        vacationDaysUsed:
          type: number
          description: Abgeleiteter Jahres-Verbrauch in Tagen (vacationHoursUsed / hoursPerDay des Team-Kontos, gerundet auf 0,1).
        vacationDaysRemaining:
          type: number
          description: Resturlaub in Tagen (vacationDays - vacationDaysUsed), abgeleitet aus der Stunden-Buchhaltung.
        valuedHours:
          type: number
        vacationFulfilledHours:
          type: number
        totalFulfilledHours:
          type: number
        nightHours:
          type: number
        nightSurchargeHours:
          type: number
        sundayHours:
          type: number
        sundaySurchargeHours:
          type: number
        holidayHours:
          type: number
        holidaySurchargeHours:
          type: number
        nightPercent:
          type: integer
        sundayPercent:
          type: integer
        holidayPercent:
          type: integer
        billingMethod:
          type: string
          enum: [SOLL, IST]
          description: Angewandte Abrechnungsart dieser Zeile (SOLL = Plan, IST = Ist-Zeiten).
        hourlyWage:
          type: ["number", "null"]
          description: Stundenlohn der Assistenzkraft (Premium-Lohnauswertung); null wenn nicht gesetzt/kein Zugriff.
        basePay:
          type: ["number", "null"]
          description: Grundvergütung nach Abrechnungsart (billingMethod) = Summe(Stundenlohn * bewertete Stunden je Dienst, ggf. prozentual) + Festbeträge, plus Lohnfortzahlung (Stundenlohn * erfüllte Urlaubs-/Krankstunden). Nur Premium.
        nightSurchargePay:
          type: ["number", "null"]
          description: Geldwert des Nachtzuschlags (Zuschlagsstunden nach Abrechnungsart inkl. Abwesenheits-Fortzahlung * Stundenlohn). Nur Premium.
        sundaySurchargePay:
          type: ["number", "null"]
          description: Geldwert des Sonntagszuschlags (Zuschlagsstunden nach Abrechnungsart inkl. Abwesenheits-Fortzahlung * Stundenlohn). Nur Premium.
        holidaySurchargePay:
          type: ["number", "null"]
          description: Geldwert des Feiertagszuschlags (Zuschlagsstunden nach Abrechnungsart inkl. Abwesenheits-Fortzahlung * Stundenlohn). Nur Premium.
        totalPay:
          type: ["number", "null"]
          description: Gesamtvergütung = basePay + Zuschläge. Nur Premium.
        # --- Weitere Abrechnungskategorien ---
        # Alle Felder OPTIONAL, damit bestehende Clients und der eingefrorene
        # Monatsabschluss-Snapshot (month_closings) kompatibel bleiben.
        # Diese Kategorien sind INFORMATIV und fließen NICHT in totalPay ein;
        # bezahlte Kategorien (Freistellung, abgesagte AG-Stunden, Teamsitzung,
        # Lohnfortzahlung) sind bereits in basePay enthalten.
        pausenzeitStunden:
          type: number
          description: Erfasste unbezahlte Pausenzeiten in Stunden (Summe pauseMinutes der FIX-Arbeitsdienste; reine Info, reduziert nicht die gewerteten Stunden).
        teamsitzungStunden:
          type: number
          description: Teamsitzungs-Stunden (FIX-Team-Tage × konfigurierte Stunden).
        teamsitzungEuro:
          type: number
          description: Vergütung der Teamsitzungen in Euro (Stundenlohn × Teamsitzungs-Stunden).
        bereitschaftenAnzahl:
          type: integer
          description: Anzahl der Bereitschafts-Dienste im Monat (FIX-Schichten mit Schichtmodell „Bereitschaft").
        bereitschaftsStunden:
          type: number
          description: Stunden der Bereitschafts-Dienste im Monat (FIX-Schichten mit Schichtmodell „Bereitschaft").
        vertretungenAnzahl:
          type: integer
          description: Anzahl der als Vertretung markierten FIX-Arbeitsdienste im Monat.
        vertretungsStunden:
          type: number
          description: Roh-Stunden der als Vertretung markierten FIX-Arbeitsdienste (Info; zählen zusätzlich normal in Soll/Erfüllt).
        urlaubsabgeltungEuro:
          type: number
          description: Urlaubsabgeltung in Euro (Stundenlohn × gewertete Stunden der FIX-Einträge vom Typ urlaubsabgeltung; fließt NICHT in totalPay ein, reine Auszahlungs-Info).
        kindKrankTage:
          type: number
          description: Anzahl der Kind-krank-Tage (FIX-Einträge vom Typ kind_krank; unbezahlt, zählen nicht in Soll/Erfüllt/Lohn).
        freistellungTage:
          type: number
          description: Anzahl der bezahlten Freistellungs-Tage (FIX-Einträge vom Typ freistellung; Lohnfortzahlung wie Krankheit).
        freistellungStunden:
          type: number
          description: Gewertete Stunden der bezahlten Freistellung (zählen in Erfüllt und Grundlohn).
        abgesagtArbeitgeberStunden:
          type: number
          description: Vom Arbeitgeber abgesagte Stunden (Typ abgesagt_ag; bezahlt nach Lohnausfallprinzip — zählen in Erfüllt und Grundlohn).
        abgesagtArbeitnehmerStunden:
          type: number
          description: Vom Arbeitnehmer abgesagte Stunden (Typ abgesagt_an; unbezahlt, reine Info — zählen nicht in Soll/Erfüllt/Lohn).
        # Abwesenheits-Anteile der Zuschläge (SV-pflichtig nach § 11 BUrlG / § 2 EFZG):
        # Der Gesamtwert (nightHours etc.) enthält BEIDE Anteile (Arbeit + Abwesenheit);
        # diese Felder isolieren den Abwesenheitsanteil für die Lohnbuchhaltung.
        absenceNightHours:
          type: number
          description: Nachtstunden aus Urlaubs-/Kranktagen (Anteil von nightHours, der auf Abwesenheitsschichten entfällt).
        absenceNightSurchargeHours:
          type: number
          description: Nachtzuschlag-Stunden aus Urlaubs-/Kranktagen (SV-pflichtig).
        absenceSundayHours:
          type: number
          description: Sonntagsstunden aus Urlaubs-/Kranktagen (Anteil von sundayHours, der auf Abwesenheitsschichten entfällt).
        absenceSundaySurchargeHours:
          type: number
          description: Sonntagszuschlag-Stunden aus Urlaubs-/Kranktagen (SV-pflichtig).
        absenceHolidayHours:
          type: number
          description: Feiertagsstunden aus Urlaubs-/Kranktagen (Anteil von holidayHours, der auf Abwesenheitsschichten entfällt).
        absenceHolidaySurchargeHours:
          type: number
          description: Feiertagszuschlag-Stunden aus Urlaubs-/Kranktagen (SV-pflichtig).
        absenceNightSurchargePay:
          type: ["number", "null"]
          description: Geldwert des SV-pflichtigen Nachtzuschlags auf Abwesenheitstagen (Premium).
        absenceSundaySurchargePay:
          type: ["number", "null"]
          description: Geldwert des SV-pflichtigen Sonntagszuschlags auf Abwesenheitstagen (Premium).
        absenceHolidaySurchargePay:
          type: ["number", "null"]
          description: Geldwert des SV-pflichtigen Feiertagszuschlags auf Abwesenheitstagen (Premium).

    MonthClosingEntry:
      type: object
      description: Eingefrorene Auswertungszeile einer Assistenzkraft zum Zeitpunkt des Abschlusses.
      required: [userId, userName, plannedHours, totalFulfilledHours, billingMethod]
      properties:
        userId:
          type: integer
        userName:
          type: string
        plannedHours:
          type: number
        totalFulfilledHours:
          type: number
        billingMethod:
          type: string
          enum: [SOLL, IST]
        hourlyWage:
          type: ["number", "null"]
        basePay:
          type: ["number", "null"]
        nightSurchargePay:
          type: ["number", "null"]
        sundaySurchargePay:
          type: ["number", "null"]
        holidaySurchargePay:
          type: ["number", "null"]
        totalPay:
          type: ["number", "null"]

    MonthClosingMeta:
      type: object
      required: [id, teamId, month, year, closedBy, closedByName, closedAt]
      properties:
        id:
          type: integer
        teamId:
          type: integer
        month:
          type: integer
        year:
          type: integer
        closedBy:
          type: integer
        closedByName:
          type: string
        closedAt:
          type: string

    MonthClosingStatus:
      type: object
      required: [closed, history, pendingTimeEntries]
      properties:
        closed:
          type: boolean
        latest:
          $ref: "#/components/schemas/MonthClosingMeta"
        history:
          type: array
          description: Alle Abschlüsse des Monats, neueste zuerst (Append-only-Historie).
          items:
            $ref: "#/components/schemas/MonthClosingMeta"
        pendingTimeEntries:
          type: integer
          description: Anzahl offener (unbestätigter) IST-Einträge im Monat — Plausibilitätswarnung vor dem Abschluss.

    CreateMonthClosingInput:
      type: object
      required: [month, year]
      properties:
        month:
          type: integer
          minimum: 1
          maximum: 12
        year:
          type: integer
        teamId:
          type: integer
          description: Optionaler Team-Kontext für die Datentrennung.

    MonthClosingDiffRow:
      type: object
      description: Nachberechnungs-Zeile — gemeldet (eingefroren) vs. aktuell je Assistenzkraft.
      required: [userId, userName, reportedHours, currentHours, diffHours]
      properties:
        userId:
          type: integer
        userName:
          type: string
        reportedHours:
          type: number
          description: Erfüllte Gesamtstunden laut Abschluss.
        currentHours:
          type: number
          description: Erfüllte Gesamtstunden nach aktuellem Stand.
        diffHours:
          type: number
        reportedPay:
          type: ["number", "null"]
          description: Gesamtvergütung (EUR) laut Abschluss; null ohne Stundenlohn.
        currentPay:
          type: ["number", "null"]
        diffPay:
          type: ["number", "null"]
        diffBasePay:
          type: ["number", "null"]
          description: Grundlohn-Anteil der Geld-Differenz (EUR); null ohne Geldwerte.
        diffSurchargePay:
          type: ["number", "null"]
          description: Zuschlags-Anteil (Nacht/Sonntag/Feiertag) der Geld-Differenz (EUR); null ohne Geldwerte.
        vacationHours:
          type: number
          description: Urlaubsstunden (Lohnfortzahlung) im AKTUELLEN Stand des abgeschlossenen Monats; nie negativ.
        vacationPay:
          type: ["number", "null"]
          description: Geldwert der Urlaubs-Lohnfortzahlung (EUR, Stundenlohn × Stunden); null ohne Stundenlohn.
        sickHours:
          type: number
          description: Krankheitsstunden (Lohnfortzahlung) im AKTUELLEN Stand des abgeschlossenen Monats; nie negativ.
        sickPay:
          type: ["number", "null"]
          description: Geldwert der Krankheits-Lohnfortzahlung (EUR, Stundenlohn × Stunden); null ohne Stundenlohn.

    MonthClosingDiff:
      type: object
      required: [closed, rows]
      properties:
        closed:
          type: boolean
          description: false = Monat (noch) nicht abgeschlossen, keine Nachberechnung.
        closedAt:
          type: string
          description: Zeitpunkt des maßgeblichen (jüngsten) Abschlusses.
        rows:
          type: array
          description: Nur Assistenzkräfte mit tatsächlicher Abweichung (Stunden oder Geld).
          items:
            $ref: "#/components/schemas/MonthClosingDiffRow"

    VacationBalance:
      type: object
      required:
        [
          contractId,
          userId,
          vacationDays,
          vacationDaysUsed,
          vacationDaysRemaining,
          vacationHoursTotal,
          vacationHoursUsed,
          vacationHoursRemaining,
          hoursPerDay,
          method,
        ]
      properties:
        contractId:
          type: integer
        userId:
          type: integer
        vacationDays:
          type: integer
          description: Anspruch in Tagen (vacationHoursTotal / hoursPerDay, gerundet).
        vacationDaysUsed:
          type: integer
          description: Verbrauchte Tage (vacationHoursUsed / hoursPerDay, gerundet, Anzeige).
        vacationDaysRemaining:
          type: integer
        vacationHoursTotal:
          type: number
          description: Gesamt-Urlaubsanspruch in Stunden (vacationDays * hoursPerDay).
        vacationHoursUsed:
          type: number
          description: Stundengenau verbrauchter Urlaub.
        vacationHoursRemaining:
          type: number
        hoursPerDay:
          type: number
          description: Umrechnungsfaktor Stunden je Tag (Standard 8).
        method:
          type: string
          enum: [bwavg, factor]
        restDaysEarned:
          type: integer
          description: >-
            Ersatzruhetage (§ 11 Abs. 3 ArbZG): Anzahl Feiertage mit
            bestaetigter Arbeit.
        restDaysRedeemed:
          type: integer
          description: Eingeloeste Ersatzruhetage (Anzahl Freizeitausgleich-Tage).
        restDaysBalance:
          type: integer
          description: Verbleibendes Ersatzruhetag-Guthaben (verdient − eingeloest).
        ersatzruhetagEnabled:
          type: boolean
          description: >-
            Ist das Ersatzruhetag-Konto für dieses Team aktiv? Bei false wird
            keine Feiertagsarbeit gutgeschrieben (restDaysEarned = 0).
        dailyHoursSource:
          type: string
          enum: [bwavg, contract, default]
          description: >-
            Quelle der Tages-Stunden-Bewertung eines ganztägigen Urlaubstags
            zum heutigen Stichtag: 13-Wochen-Schnitt (bwavg), Vertragsdaten
            (Wochenstunden ÷ Arbeitstage/Woche) oder Standardwert. Bei
            "contract" sollte die UI auf die Datenpflege der Arbeitstage/Woche
            hinweisen (Migrations-Default 5).
        dailyHours:
          type: number
          description: Verwendete Stunden je Urlaubstag zum heutigen Stichtag.
        contractWorkdaysPerWeek:
          type: ["integer", "null"]
          description: Arbeitstage/Woche des aktiven Vertrags (null ohne Vertrag).
        contractWeeklyHours:
          type: ["number", "null"]
          description: Wochenstunden des aktiven Vertrags (null ohne Vertrag).

    AuthUser:
      type: object
      required: [id, name, email, role, accountType, plan]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, assistant, superadmin]
        accountType:
          type: string
          enum: [privat, dienstleister]
        plan:
          type: string
          enum: [free, premium]
        isTeamleiter:
          type: boolean
          description: >-
            true, wenn der Nutzer in mindestens einem Team als Teamleiter eingetragen
            ist. Ermöglicht dem Frontend den Team-Switcher auch für Nicht-Dienstleister
            anzuzeigen.
        teamAccessLevel:
          type: string
          enum: [keine, basis, stufe1, stufe2]
          description: >-
            Höchste gestufte Team-Freischaltung über alle Mitgliedschaften hinweg.
            Steuert nur die Sichtbarkeit im Frontend; die Durchsetzung erfolgt
            serverseitig pro Team.

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UpdateProfileInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email

    RegisterInput:
      type: object
      required: [name, email, password, accountType]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        accountType:
          type: string
          enum: [privat, dienstleister]
