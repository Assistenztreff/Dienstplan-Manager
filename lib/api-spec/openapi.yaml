  /operator/accounts/{id}/plan:
    patch:
      operationId: updateOperatorAccountPlan
      tags: [operator]
      summary: Plan eines Kontos manuell umschalten (nur superadmin)
      description: >
        Manuelle Premium-Freischaltung bzw. Rückstufung nach bestätigtem
        Zahlungseingang. Wirkung ist sofort, da die Plan-Durchsetzung den Plan
        pro Request frisch aus der Datenbank liest.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorPlanUpdate"
      responses:
        "200":
          description: Aktualisiertes Konto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccount"
        "403":
          description: Keine Berechtigung (kein superadmin)
        "404":
          description: Konto nicht gefunden

  /operator/plan-changes:
    get:
      operationId: listOperatorPlanChanges
      tags: [operator]
      summary: Audit-Log der Plan-Umschaltungen (nur superadmin)
      description: >
        Liefert die letzten manuellen Plan-Änderungen (Premium-Freischaltungen
        und Rückstufungen) mit betroffenem Konto, altem/neuem Plan,
        ausführendem Superadmin und Zeitstempel — neueste zuerst.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: search
          in: query
          required: false
          description: >
            Optionaler Suchbegriff. Filtert die Einträge nach Konto (Name oder
            E-Mail) oder nach dem Inhalt der Referenz/Notiz (z. B. Belegnummer).
            Groß-/Kleinschreibung wird ignoriert.
          schema:
            type: string
            maxLength: 200
        - name: from
          in: query
          required: false
          description: >
            Optionaler Zeitraum-Anfang als ISO-8601-Zeitstempel. Es werden nur
            Änderungen ab diesem Zeitpunkt (einschließlich) zurückgegeben.
            Kombinierbar mit search und to.
          schema:
            type: string
            maxLength: 40
        - name: to
          in: query
          required: false
          description: >
            Optionales Zeitraum-Ende als ISO-8601-Zeitstempel. Es werden nur
            Änderungen bis zu diesem Zeitpunkt (einschließlich) zurückgegeben.
            Kombinierbar mit search und from.
          schema:
            type: string
            maxLength: 40
      responses:
        "200":
          description: Liste der Plan-Änderungen (neueste zuerst)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorPlanChange"
        "403":
          description: Keine Berechtigung (kein superadmin)

  /operator/errors:
    get:
      operationId: listOperatorErrors
      tags: [operator]
      summary: Fehler-Tracking der Plattform (nur superadmin)
      description: >
        Liefert die neuesten erfassten Serverfehler (unbehandelte 5xx-Fehler
        und gezielt gemeldete kritische Fehler) mit Schweregrad, Meldung,
        Kontext (Route) und Zeitstempel. Wiederkehrende Fehler (gleiche
        Meldung + gleicher Kontext) sind zu EINEM Eintrag gebündelt (count +
        lastSeenAt); sortiert nach letztem Auftreten, neueste zuerst. Die
        Aufbewahrung ist serverseitig begrenzt; die Antwort enthält dafür die
        Gesamtzahl gespeicherter Einträge (totalStored) und das
        Aufbewahrungslimit (retentionLimit), damit das Dashboard warnen kann,
        wenn älteste Einträge bereits verworfen wurden.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: from
          in: query
          required: false
          description: >
            Optionaler Zeitraum-Anfang als ISO-8601-Zeitstempel. Es werden nur
            Fehler zurückgegeben, deren LETZTES Auftreten (lastSeenAt) ab
            diesem Zeitpunkt (einschließlich) liegt. Kombinierbar mit to.
          schema:
            type: string
            maxLength: 40
        - name: to
          in: query
          required: false
          description: >
            Optionales Zeitraum-Ende als ISO-8601-Zeitstempel. Es werden nur
            Fehler zurückgegeben, deren LETZTES Auftreten (lastSeenAt) bis zu
            diesem Zeitpunkt (einschließlich) liegt. Kombinierbar mit from.
          schema:
            type: string
            maxLength: 40
        - name: search
          in: query
          required: false
          description: >
            Optionaler Suchbegriff. Filtert serverseitig case-insensitiv über
            die Meldung (message) und den Kontext/Route (context). Kombinierbar
            mit from/to.
          schema:
            type: string
            maxLength: 200
      responses:
        "200":
          description: Liste der Plattform-Fehler (neueste zuerst) samt Aufbewahrungs-Metadaten
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorErrorList"
        "403":
          description: Keine Berechtigung (kein superadmin)

  /operator/errors/resolve-all:
    post:
      operationId: resolveAllOperatorErrors
      tags: [operator]
      summary: Alle offenen Fehler-Einträge abhaken (nur superadmin)
      description: >
        Setzt resolved = true für ALLE aktuell offenen Plattform-Fehler in
        einem Schritt (z. B. nach einem Vorfall mit vielen gleichartigen
        Einträgen). Erledigte Einträge bleiben erhalten; das
        Aufbewahrungslimit gilt unverändert.
      responses:
        "200":
          description: Anzahl der abgehakten Einträge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorErrorsResolveAllResult"
        "403":
          description: Keine Berechtigung (kein superadmin)

  /operator/errors/{id}:
    patch:
      operationId: updateOperatorError
      tags: [operator]
      summary: Fehler-Eintrag als erledigt/offen markieren (nur superadmin)
      description: >
        Setzt den Erledigt-Status eines erfassten Plattform-Fehlers. Da
        wiederkehrende Fehler gebündelt sind, wirkt das Abhaken auf die ganze
        Gruppe; tritt der Fehler danach erneut auf, gilt der Eintrag wieder
        als offen. Erledigte Einträge bleiben erhalten (Aufbewahrungslimit
        unverändert), werden im Operator-Dashboard aber ausgegraut bzw. per
        Filter ausgeblendet.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorErrorUpdate"
      responses:
        "200":
          description: Aktualisierter Fehler-Eintrag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorError"
        "400":
          description: Ungültige Eingabe
        "403":
          description: Keine Berechtigung (kein superadmin)
        "404":
          description: Fehler-Eintrag nicht gefunden

  /operator/lexware/bookings:
    get:
      operationId: listOperatorLexwareBookings
      tags: [operator]
      summary: Lexware-Buchungs-Log (nur superadmin)
      description: >
        Liefert die letzten Buchungen (Rechnungsentwürfe und Zahlungseingänge)
        aus Lexware für das Operator-Dashboard, neueste zuerst. Die Anbindung
        läuft über ein austauschbares Adapter-Interface (LexwareClient im
        api-server): ohne konfiguriertes Secret LEXWARE_API_KEY liefert ein
        Mock-Adapter realistische Beispieldaten (source = "demo"); mit Secret
        antwortet später der echte Lexware-Client in identischer Form
        (source = "live") — Frontend und Schema bleiben unverändert.
      responses:
        "200":
          description: Buchungsliste samt Quelle (demo oder live)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LexwareBookingList"
        "403":
          description: Keine Berechtigung (kein superadmin)

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, role, accountType, plan, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, assistant, superadmin]
        accountType:
          type: string
          enum: [privat, dienstleister]
        plan:
          type: string
          enum: [free, premium]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        socialSecurityNumber:
          type: ["string", "null"]
        taxId:
          type: ["string", "null"]
        taxClass:
          type: ["string", "null"]
        healthInsurance:
          type: ["string", "null"]
        iban:
          type: ["string", "null"]
        hourlyWage:
          type: ["number", "null"]
          description: Bruttostundenlohn in Euro (erweiterte Personalakte, premium).
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OperatorAccount:
      type: object
      required: [id, name, email, accountType, plan, teams, assistants, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        accountType:
          type: string
          enum: [privat, dienstleister]
        plan:
          type: string
          enum: [free, premium]
        teams:
          type: integer
          description: Anzahl der Teams im Besitz dieses Kontos
        assistants:
          type: integer
          description: Anzahl unterschiedlicher Assistenten in den Teams dieses Kontos
        createdAt:
          type: string
          format: date-time

    OperatorPlanUpdate:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, premium]
        note:
          type: string
          maxLength: 500
          description: Optionale Rechnungs-/Zahlungsreferenz (z. B. Lexware-Belegnummer) oder Notiz zum Grund der Umstellung

    OperatorPlanChange:
      type: object
      required:
        [id, accountId, accountName, accountEmail, oldPlan, newPlan, note, changedByName, createdAt]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        accountName:
          type: string
          description: Name des betroffenen Kontos
        accountEmail:
          type: string
        oldPlan:
          type: string
          enum: [free, premium]
        newPlan:
          type: string
          enum: [free, premium]
        note:
          type: ["string", "null"]
          description: Rechnungs-/Zahlungsreferenz oder Notiz zur Umstellung (falls angegeben)
        changedByName:
          type: string
          description: Name des ausführenden Superadmins
        createdAt:
          type: string
          format: date-time

    OperatorError:
      type: object
      required: [id, level, message, context, resolved, count, lastSeenAt, createdAt]
      properties:
        id:
          type: integer
        level:
          type: string
          enum: [error, warning]
        message:
          type: string
        context:
          type: string
          description: Route/Stelle, an der der Fehler auftrat (z. B. "GET /api/shifts")
        resolved:
          type: boolean
          description: Vom Betreiber als erledigt abgehakt (gilt für die ganze Gruppe; erneutes Auftreten öffnet den Eintrag wieder)
        count:
          type: integer
          description: Wie oft dieser Fehler (gleiche Meldung + Kontext) aufgetreten ist
        lastStack:
          type: string
          nullable: true
          description: Detailtext (Stacktrace, gekürzt) des LETZTEN Auftretens; kann fehlen
        lastSeenAt:
          type: string
          format: date-time
          description: Zeitpunkt des letzten Auftretens
        createdAt:
          type: string
          format: date-time
          description: Zeitpunkt des ersten Auftretens

    OperatorErrorList:
      type: object
      required: [errors, totalStored, retentionLimit]
      properties:
        errors:
          type: array
          items:
            $ref: "#/components/schemas/OperatorError"
        totalStored:
          type: integer
          description: Gesamtzahl aktuell gespeicherter Fehler-Einträge (unabhängig vom limit-Parameter)
        retentionLimit:
          type: integer
          description: >-
            Aufbewahrungslimit des Servers (maximal so viele Einträge werden
            behalten; älteste nach letztem Auftreten werden verworfen). Ist
            totalStored gleich diesem Wert, wurden mit hoher Wahrscheinlichkeit
            bereits älteste Einträge entfernt.

    OperatorErrorUpdate:
      type: object
      required: [resolved]
      properties:
        resolved:
          type: boolean
          description: true = als erledigt abhaken, false = wieder auf offen setzen

    LexwareBooking:
      type: object
      required: [id, accountName, accountEmail, type, amount, date, status]
      properties:
        id:
          type: string
          description: Belegnummer aus Lexware (z. B. Rechnungsnummer "LX-2026-0042")
        accountName:
          type: string
          description: Name des zugehörigen Kundenkontos
        accountEmail:
          type: string
          description: E-Mail des zugehörigen Kundenkontos
        type:
          type: string
          enum: [Rechnungsentwurf, Zahlungseingang]
          description: Art der Buchung
        amount:
          type: number
          description: Betrag in Euro (Brutto)
        date:
          type: string
          description: Belegdatum (ISO-Format JJJJ-MM-TT)
        status:
          type: string
          enum: [offen, bezahlt, storniert]

    LexwareBookingList:
      type: object
      required: [source, bookings]
      properties:
        source:
          type: string
          enum: [demo, live]
          description: >-
            Datenquelle: "demo" = Mock-Adapter mit Beispieldaten (kein
            LEXWARE_API_KEY konfiguriert), "live" = echte Lexware-API.
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/LexwareBooking"

    OperatorErrorsResolveAllResult:
      type: object
      required: [resolvedCount]
      properties:
        resolvedCount:
          type: integer
          description: Anzahl der Einträge, die von offen auf erledigt gesetzt wurden

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, assistant]
        phone:
          type: string
        address:
          type: string
        birthDate:
          type: string
        socialSecurityNumber:
          type: string
        taxId:
          type: string
        taxClass:
          type: string
        healthInsurance:
          type: string
        iban:
          type: string
        hourlyWage:
          type: number
          description: Bruttostundenlohn in Euro (erweiterte Personalakte, premium).
        isActive:
          type: boolean
        teamId:
          type: integer
          description: Optionales Ziel-Team; der neue Nutzer wird Mitglied dieses Teams. Ohne Angabe das Standard-Team des Erstellers.

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        accountType:
          type: string
          enum: [privat, dienstleister]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        socialSecurityNumber:
          type: ["string", "null"]
        taxId:
          type: ["string", "null"]
        taxClass:
          type: ["string", "null"]
        healthInsurance:
          type: ["string", "null"]
        iban:
          type: ["string", "null"]
        hourlyWage:
          type: ["number", "null"]
          description: Bruttostundenlohn in Euro (erweiterte Personalakte, premium).
        isActive:
          type: boolean

    Team:
      type: object
      required: [id, name, ownerId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: integer
        createdAt:
          type: string
          format: date-time

    TeamInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TeamUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TeamMember:
      type: object
      required: [id, teamId, userId, name, email, role, teamCount, isTeamleiter, canViewPayroll, accessLevel, createdAt]
      properties:
        id:
          type: integer
        teamId:
          type: integer
        userId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, assistant]
        teamCount:
          type: integer
          description: Anzahl der Teams dieses Dienstleisters, in denen der Nutzer Mitglied ist
        isTeamleiter:
          type: boolean
          description: Gibt dem Mitglied Admin-Level-Zugriff auf genau dieses Team
        canViewPayroll:
          type: boolean
          description: >-
            Erlaubt Zugriff auf Lohn- und sensible Personalfelder. Nur für
            Unternehmens-Teamleiter eines Dienstleister-Kontos setzbar.
        accessLevel:
          type: string
          enum: [keine, basis, stufe1, stufe2]
          description: >-
            Gestufte Team-Freischaltung für Assistenznehmer beim Dienstleister.
            keine = keine Team-Rechte, basis = Lese-Übersicht,
            stufe1 = Planen und Assistenzkräfte pflegen,
            stufe2 = zusätzlich Team-Verwaltung und Zeiterfassung.
        createdAt:
          type: string
          format: date-time

    TeamMemberFlagsInput:
      type: object
      properties:
        isTeamleiter:
          type: boolean
        canViewPayroll:
          type: boolean
        accessLevel:
          type: string
          enum: [keine, basis, stufe1, stufe2]

    TeamMemberInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    TeamMemberMoveInput:
      type: object
      required: [targetTeamId]
      properties:
        targetTeamId:
          type: integer

    Contract:
      type: object
      required: [id, userId, weeklyHours, vacationDays, startDate, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        weeklyHours:
          type: number
        workdaysPerWeek:
          type: number
          description: Arbeitstage pro Woche (0,5–7, Dezimalwerte erlaubt); Basis für den Vertrags-Fallback der bwavg-Urlaubsbewertung.
        workdaysConfirmedAt:
          type: ["string", "null"]
          format: date-time
          description: Zeitpunkt der letzten bewussten Arbeitstage-Festlegung; null = Migrations-Default, Datenpflege-Hinweis anzeigen.
        vacationDays:
          type: integer
        vacationHoursUsed:
          type: number
          description: Stundengenau verbrauchter Urlaub (Point 7). Pool = vacationDays * vacationHoursPerDay.
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    ContractInput:
      type: object
      required: [userId, weeklyHours, vacationDays, startDate]
      properties:
        userId:
          type: integer
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        weeklyHours:
          type: number
          minimum: 0
        workdaysPerWeek:
          type: number
          minimum: 0.5
          maximum: 7
          description: Arbeitstage pro Woche (0,5–7, Dezimalwerte erlaubt), Default 5.
        vacationDays:
          type: integer
          minimum: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string

    ContractUpdate:
      type: object
      properties:
        weeklyHours:
          type: number
          minimum: 0
        workdaysPerWeek:
          type: number
          minimum: 0.5
          maximum: 7
          description: Arbeitstage pro Woche (0,5–7, Dezimalwerte erlaubt). Bei Angabe wird workdaysConfirmedAt gesetzt.
        workdaysConfirm:
          type: boolean
          description: true = Arbeitstage/Woche als geprüft bestätigen (setzt nur workdaysConfirmedAt, ohne Werte zu ändern).
        vacationDays:
          type: integer
          minimum: 0
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    HourBudget:
      type: object
      required: [id, teamId, monthlyHours, startDate, createdAt]
      properties:
        id:
          type: integer
        teamId:
          type: integer
        monthlyHours:
          type: number
          description: Genehmigte Assistenzstunden pro Monat (Zielvereinbarung, Bedarfsseite).
        startDate:
          type: string
          format: date
          description: Beginn der Gültigkeit (inklusive).
        endDate:
          type: ["string", "null"]
          description: Ende der Gültigkeit (inklusive); null = unbefristet.
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    HourBudgetInput:
      type: object
      required: [monthlyHours, startDate]
      properties:
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        monthlyHours:
          type: number
          exclusiveMinimum: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string

    HourBudgetUpdate:
      type: object
      properties:
        monthlyHours:
          type: number
          exclusiveMinimum: 0
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    HourBudgetBalance:
      type: object
      required:
        - month
        - year
        - approvedHours
        - consumedHours
        - remainingHours
        - yearApprovedHours
        - yearConsumedHours
        - yearBalance
        - warningThresholdHours
        - warningActive
        - hasBudgets
      properties:
        month:
          type: integer
        year:
          type: integer
        approvedHours:
          type: number
          description: Genehmigte Stunden des Monats (0 ohne gültige Zielvereinbarung).
        consumedHours:
          type: number
          description: Verbrauchte Stunden des Monats (nur echte Arbeitsdienste, keine Abwesenheiten).
        remainingHours:
          type: number
          description: Verbleibende Stunden des Monats (genehmigt minus verbraucht).
        yearApprovedHours:
          type: number
          description: Kumuliert genehmigte Stunden seit Jahresbeginn (Januar bis Auswertungsmonat).
        yearConsumedHours:
          type: number
          description: Kumuliert verbrauchte Stunden seit Jahresbeginn.
        yearBalance:
          type: number
          description: Laufender Jahressaldo (genehmigt minus verbraucht; positiv = angespart).
        warningThresholdHours:
          type: number
          description: Warnschwelle = 1,5 × Monatsbudget.
        warningActive:
          type: boolean
          description: true, sobald der Jahressaldo die Warnschwelle übersteigt (nur bei vorhandenem Monatsbudget).
        hasBudgets:
          type: boolean
          description: true, sobald im Scope mindestens eine Zielvereinbarung existiert (die Dashboard-Kachel blendet sich ohne Budget aus).

    Shift:
      type: object
      required: [id, userId, startTime, endTime, type, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        type:
          type: string
          enum: [active, standby, night, full_day, vacation, sick, work, freizeitausgleich, team, kind_krank, freistellung, abgesagt_ag, abgesagt_an, urlaubsabgeltung]
        planningStatus:
          type: string
          description: >-
            Planungsstatus: VORLAEUFIG = Entwurf, ANGEBOTEN = Vorschlag,
            FIX = verbindlich bestätigt.
          enum: [VORLAEUFIG, ANGEBOTEN, FIX]
        shiftModelId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        einsatzTeamId:
          type: ["integer", "null"]
          description: >-
            Aushilfe-Einsatz: ID des anderen eigenen Teams, für das dieser
            Einsatz erfolgt. Die Schicht (und ihre Stunden) bleiben beim
            Stammteam; das Ziel-Team sieht nur einen schreibgeschützten
            Spiegel-Eintrag.
        einsatzTeamName:
          type: ["string", "null"]
          description: Name des Einsatz-Teams (nur gesetzt, wenn einsatzTeamId gesetzt ist).
        homeTeamName:
          type: ["string", "null"]
          description: >-
            Name des Stammteams der Schicht (nur gesetzt, wenn einsatzTeamId
            gesetzt ist) — für den Badge "Aushilfe aus …" im Ziel-Team-Kalender.
        isVertretung:
          type: boolean
          description: >-
            Vertretung: Arbeitsdienst als kurzfristige Vertretung markiert
            (Info-Kennzahl der Auswertung; Stunden zählen normal).
        pauseMinutes:
          type: integer
          description: >-
            Unbezahlte Pausenminuten (reine Info-Kennzahl; reduziert NICHT
            die gewerteten Stunden).
        valuedHours:
          type: number
        nightHours:
          type: number
        sundayHours:
          type: number
        holidayHours:
          type: number
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    ShiftInput:
      type: object
      required: [userId, startTime, endTime, type]
      properties:
        userId:
          type: integer
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        type:
          type: string
          enum: [active, standby, night, full_day, vacation, sick, work, freizeitausgleich, team, kind_krank, freistellung, abgesagt_ag, abgesagt_an, urlaubsabgeltung]
        planningStatus:
          type: string
          description: >-
            Optionaler Planungsstatus (Default FIX): VORLAEUFIG = Entwurf,
            ANGEBOTEN = Vorschlag, FIX = verbindlich bestätigt.
          enum: [VORLAEUFIG, ANGEBOTEN, FIX]
        shiftModelId:
          type: ["integer", "null"]
        notes:
          type: string
          maxLength: 500
          description: Optionale Notiz / Kommentar zur Schicht (max. 500 Zeichen).
        einsatzTeamId:
          type: ["integer", "null"]
          description: >-
            Aushilfe-Einsatz: ID eines anderen eigenen Teams, für das der
            Einsatz erfolgt. Muss ein erlaubtes Team des Aufrufers sein und
            darf nicht das Team der Schicht selbst sein; bei Abwesenheiten
            nicht erlaubt.
        isVertretung:
          type: boolean
          description: >-
            Vertretung: Arbeitsdienst als kurzfristige Vertretung markieren
            (nur für Arbeitsdienste; bei Abwesenheiten/Team-Einträgen
            serverseitig zurückgesetzt).
        pauseMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: >-
            Unbezahlte Pausenminuten (Info-Kennzahl; reduziert NICHT die
            gewerteten Stunden).

    BulkAbsenceInput:
      type: object
      required: [userId, type, days]
      properties:
        userId:
          type: integer
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        type:
          type: string
          description: Abwesenheitsart — nur Abwesenheiten sind als Sammelauftrag erlaubt.
          enum: [vacation, sick, freizeitausgleich, kind_krank, freistellung, abgesagt_ag, abgesagt_an, urlaubsabgeltung]
        days:
          type: array
          minItems: 1
          maxItems: 92
          description: >-
            Ein Eintrag pro Kalendertag (Start/Ende desselben Tages, i. d. R.
            00:00–23:59). Doppelte Kalendertage innerhalb der Liste werden
            zusammengefasst.
          items:
            type: object
            required: [startTime, endTime]
            properties:
              startTime:
                type: string
                format: date-time
              endTime:
                type: string
                format: date-time
        shiftModelId:
          type: ["integer", "null"]
          description: >-
            Optionales Schichtmodell: liefert an Tagen ohne geplanten Dienst
            die Standardzeiten (wie beim Einzel-Anlegen).
        notes:
          type: string
          maxLength: 500

    BulkAbsenceResult:
      type: object
      required: [createdCount, skippedCount, skippedDates, shiftIds]
      properties:
        createdCount:
          type: integer
        skippedCount:
          type: integer
        skippedDates:
          type: array
          description: Übersprungene Kalendertage (yyyy-MM-dd) mit bereits vorhandener Abwesenheit desselben Typs.
          items:
            type: string
        shiftIds:
          type: array
          items:
            type: integer

    ShiftUpdate:
      type: object
      properties:
        userId:
          type: integer
          description: >-
            Optionaler Wechsel des zugewiesenen Assistenten. Der neue Nutzer
            muss Mitglied des Teams der Schicht sein (Member-of-Team-Invariante),
            sonst 403. Wird genutzt für das Tauschen des Assistenten beim
            Massen-Ändern bestehender Schichten.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        type:
          type: string
          enum: [active, standby, night, full_day, vacation, sick, work, freizeitausgleich, team, kind_krank, freistellung, abgesagt_ag, abgesagt_an, urlaubsabgeltung]
        planningStatus:
          type: string
          description: >-
            Planungsstatus: VORLAEUFIG = Entwurf, ANGEBOTEN = Vorschlag,
            FIX = verbindlich bestätigt.
          enum: [VORLAEUFIG, ANGEBOTEN, FIX]
        shiftModelId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
          maxLength: 500
          description: Notiz / Kommentar setzen oder mit null löschen (max. 500 Zeichen).
        einsatzTeamId:
          type: ["integer", "null"]
          description: >-
            Aushilfe-Einsatz setzen oder mit null entfernen. Gleiche Regeln
            wie beim Anlegen (eigenes anderes Team, keine Abwesenheiten).
        isVertretung:
          type: boolean
          description: >-
            Vertretung setzen/entfernen (nur für Arbeitsdienste; bei
            Abwesenheiten/Team-Einträgen serverseitig zurückgesetzt).
        pauseMinutes:
          type: integer
          minimum: 0
          maximum: 1440
          description: >-
            Unbezahlte Pausenminuten (Info-Kennzahl; reduziert NICHT die
            gewerteten Stunden).

