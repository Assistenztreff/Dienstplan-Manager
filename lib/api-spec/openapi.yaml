openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Dienstplan-App API für Persönliche Assistenz
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: users
    description: Benutzer und Rollen
  - name: contracts
    description: Verträge und Konditionen
  - name: shifts
    description: Dienstplan und Schichten
  - name: time-tracking
    description: Zeiterfassung
  - name: dashboard
    description: Dashboard-Übersicht
  - name: invitations
    description: Team-Einladungen
  - name: auth
    description: Authentifizierung
  - name: branding-settings
    description: Firmenlogo und Branding
  - name: Storage
    description: Object storage upload and serving endpoints.
  - name: operator
    description: Betreiber-Konsole (nur superadmin)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: Alle Benutzer auflisten
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [admin, assistant]
        - name: teamId
          in: query
          description: Optionaler Team-Kontext; schränkt auf Mitglieder dieses Teams ein.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Benutzer
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Neuen Benutzer anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Benutzer abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Nicht gefunden
    patch:
      operationId: updateUser
      tags: [users]
      summary: Benutzer aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Benutzer löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht

  /contracts:
    get:
      operationId: listContracts
      tags: [contracts]
      summary: Alle Verträge auflisten
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Verträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Contract"
    post:
      operationId: createContract
      tags: [contracts]
      summary: Vertrag anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"

  /contracts/{id}:
    get:
      operationId: getContract
      tags: [contracts]
      summary: Vertrag abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vertrag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
        "404":
          description: Nicht gefunden
    patch:
      operationId: updateContract
      tags: [contracts]
      summary: Vertrag aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContractUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Contract"
    delete:
      operationId: deleteContract
      tags: [contracts]
      summary: Vertrag löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht

  /shifts:
    get:
      operationId: listShifts
      tags: [shifts]
      summary: Schichten auflisten
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: type
          in: query
          schema:
            type: string
            enum: [active, standby, night, full_day, vacation, sick, work]
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Schichten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shift"
    post:
      operationId: createShift
      tags: [shifts]
      summary: Schicht anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "409":
          description: >-
            Konflikt. Entweder überschneidet sich die Schicht mit einer
            bestehenden Schicht desselben Assistenten (code "shift_overlap"),
            oder es existiert bereits eine Abwesenheit desselben Typs am selben
            Tag (code "absence_duplicate"). Im zweiten Fall wird kein Eintrag
            angelegt und der Urlaubsanspruch nicht erneut belastet.

  /shifts/{id}:
    get:
      operationId: getShift
      tags: [shifts]
      summary: Schicht abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Schicht
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
        "404":
          description: Nicht gefunden
    patch:
      operationId: updateShift
      tags: [shifts]
      summary: Schicht aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shift"
    delete:
      operationId: deleteShift
      tags: [shifts]
      summary: Schicht löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht

  /shift-models:
    get:
      operationId: listShiftModels
      tags: [shift-models]
      summary: Schichtmodelle auflisten
      parameters:
        - name: activeOnly
          in: query
          schema:
            type: boolean
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Schichtmodelle
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftModel"
    post:
      operationId: createShiftModel
      tags: [shift-models]
      summary: Schichtmodell anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftModelInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftModel"

  /shift-models/{id}:
    patch:
      operationId: updateShiftModel
      tags: [shift-models]
      summary: Schichtmodell aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftModelUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftModel"
        "404":
          description: Nicht gefunden
    delete:
      operationId: deleteShiftModel
      tags: [shift-models]
      summary: Schichtmodell löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht
        "404":
          description: Nicht gefunden

  /shift-templates:
    get:
      operationId: listShiftTemplates
      tags: [shift-templates]
      summary: Arbeitszeit-Vorlagen auflisten
      parameters:
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Vorlagen
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ShiftTemplate"
    post:
      operationId: createShiftTemplate
      tags: [shift-templates]
      summary: Arbeitszeit-Vorlage anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftTemplateInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplate"

  /shift-templates/{id}:
    patch:
      operationId: updateShiftTemplate
      tags: [shift-templates]
      summary: Arbeitszeit-Vorlage aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShiftTemplateUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShiftTemplate"
        "404":
          description: Nicht gefunden
    delete:
      operationId: deleteShiftTemplate
      tags: [shift-templates]
      summary: Arbeitszeit-Vorlage löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht
        "404":
          description: Nicht gefunden

  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: Teams auflisten
      responses:
        "200":
          description: Liste der Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Team anlegen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}:
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Team aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "404":
          description: Nicht gefunden
    delete:
      operationId: deleteTeam
      tags: [teams]
      summary: Team löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht
        "404":
          description: Nicht gefunden
        "409":
          description: Team enthält noch Daten oder Mitglieder

  /teams/{id}/members:
    get:
      operationId: listTeamMembers
      tags: [teams]
      summary: Team-Mitglieder auflisten
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Mitglieder
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
        "404":
          description: Team nicht gefunden
    post:
      operationId: addTeamMember
      tags: [teams]
      summary: Mitglied zum Team hinzufügen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Hinzugefügt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "404":
          description: Team oder Benutzer nicht gefunden
        "409":
          description: Benutzer ist bereits Mitglied

  /teams/{id}/members/{userId}:
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Mitglied aus Team entfernen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Entfernt
        "404":
          description: Nicht gefunden

  /allowance-settings:
    get:
      operationId: getAllowanceSettings
      tags: [allowance-settings]
      summary: Zuschlags-Einstellungen lesen
      responses:
        "200":
          description: Zuschlags-Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceSettings"
    put:
      operationId: updateAllowanceSettings
      tags: [allowance-settings]
      summary: Zuschlags-Einstellungen aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AllowanceSettingsInput"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AllowanceSettings"

  /branding-settings:
    get:
      operationId: getBrandingSettings
      tags: [branding-settings]
      summary: Branding-Einstellungen (Firmenlogo) lesen
      parameters:
        - name: teamId
          in: query
          description: Optionaler Team-Kontext; liest das teamspezifische Logo statt des globalen.
          schema:
            type: integer
      responses:
        "200":
          description: Branding-Einstellungen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingSettings"
        "403":
          description: Kein Zugriff auf dieses Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    put:
      operationId: updateBrandingSettings
      tags: [branding-settings]
      summary: Branding-Einstellungen (Firmenlogo) aktualisieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrandingSettingsInput"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrandingSettings"
        "400":
          description: Ungültige Anfrage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "403":
          description: Kein Zugriff auf dieses Team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /storage/uploads/request-url:
    post:
      tags: [Storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      description: |
        Returns a presigned GCS URL for direct upload. The client sends JSON
        metadata here, then uploads the file directly to the returned URL.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Presigned upload URL generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        "400":
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to generate upload URL.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/public-objects/{filePath}:
    get:
      tags: [Storage]
      operationId: getPublicObject
      summary: Serve a public asset from PUBLIC_OBJECT_SEARCH_PATHS
      description: |
        Unconditionally public — no authentication or ACL checks.
        Searches PUBLIC_OBJECT_SEARCH_PATHS for the given file path.
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
          description: Relative file path within the public search paths.
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: File not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve public object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /storage/objects/{objectPath}:
    get:
      tags: [Storage]
      operationId: getStorageObject
      summary: Serve an object entity from PRIVATE_OBJECT_DIR
      description: |
        Serves object entities uploaded via presigned URLs. These can optionally
        be protected with authentication or ACL checks based on the use case.
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
          description: Object path within the private object dir (e.g. `uploads/some-uuid`).
      responses:
        "200":
          description: Object content streamed with correct Content-Type.
          content:
            "*/*":
              schema:
                type: string
                format: binary
        "404":
          description: Object not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "500":
          description: Failed to serve object.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /time-tracking:
    get:
      operationId: listTimeEntries
      tags: [time-tracking]
      summary: Zeiteinträge auflisten
      parameters:
        - name: userId
          in: query
          schema:
            type: integer
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, rejected]
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Liste der Zeiteinträge
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TimeEntry"
    post:
      operationId: createTimeEntry
      tags: [time-tracking]
      summary: Zeiteintrag erstellen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryInput"
      responses:
        "201":
          description: Erstellt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /time-tracking/{id}:
    get:
      operationId: getTimeEntry
      tags: [time-tracking]
      summary: Zeiteintrag abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Zeiteintrag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
        "404":
          description: Nicht gefunden
    patch:
      operationId: updateTimeEntry
      tags: [time-tracking]
      summary: Zeiteintrag aktualisieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryUpdate"
      responses:
        "200":
          description: Aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"
    delete:
      operationId: deleteTimeEntry
      tags: [time-tracking]
      summary: Zeiteintrag löschen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Gelöscht

  /time-tracking/{id}/confirm:
    patch:
      operationId: confirmTimeEntry
      tags: [time-tracking]
      summary: Zeiteintrag bestätigen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryConfirm"
      responses:
        "200":
          description: Bestätigt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntry"

  /time-tracking/confirm-batch:
    post:
      operationId: confirmTimeEntriesBatch
      tags: [time-tracking]
      summary: Offene Zeiteinträge gesammelt bestätigen (Premium strictTimeTracking)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimeEntryConfirmBatch"
      responses:
        "200":
          description: Ergebnis der Sammelbestätigung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TimeEntryConfirmBatchResult"
        "403":
          description: Premium-Feature erforderlich
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"

  /users/{id}/invite:
    post:
      operationId: inviteUser
      tags: [invitations]
      summary: Einladungslink für Assistenten generieren
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Einladungslink
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteResult"
        "404":
          description: Nicht gefunden

  /calendar-export:
    get:
      operationId: exportCalendar
      tags: [dashboard]
      summary: Dienstplan als iCalendar (.ics) exportieren (Premium calendarSync)
      parameters:
        - name: teamId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: iCalendar-Datei mit den verbindlichen (FIX) Schichten
          content:
            text/calendar:
              schema:
                type: string
        "403":
          description: Premium-Tarif erforderlich (plan_feature_required)

  /calendar-token:
    get:
      operationId: getCalendarToken
      tags: [dashboard]
      summary: Aktuellen Kalender-Abo-Token abrufen (Premium calendarSync)
      responses:
        "200":
          description: Aktueller Abo-Token (token = null, wenn keiner existiert)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarToken"
        "403":
          description: Premium-Tarif erforderlich (plan_feature_required)
    post:
      operationId: rotateCalendarToken
      tags: [dashboard]
      summary: Kalender-Abo-Token erzeugen/erneuern (Premium calendarSync)
      responses:
        "200":
          description: Neuer Abo-Token (alter Token wird sofort ungültig)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarToken"
        "403":
          description: Premium-Tarif erforderlich (plan_feature_required)
    delete:
      operationId: revokeCalendarToken
      tags: [dashboard]
      summary: Kalender-Abo-Token widerrufen (Feed-URL wird ungültig)
      responses:
        "204":
          description: Token widerrufen

  /calendar-feed/{token}:
    get:
      operationId: getCalendarFeed
      tags: [dashboard]
      summary: Öffentlicher iCalendar-Feed (Abo via Geheim-Token, ohne Session)
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: iCalendar-Feed mit den verbindlichen (FIX) Schichten
          content:
            text/calendar:
              schema:
                type: string
        "403":
          description: Premium-Tarif des Token-Eigentümers erforderlich
        "404":
          description: Unbekannter oder widerrufener Token

  /contracts/{id}/vacation-balance:
    get:
      operationId: getVacationBalance
      tags: [contracts]
      summary: Urlaubskontigent abrufen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Urlaubskontigent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VacationBalance"
        "404":
          description: Nicht gefunden

  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Dashboard-Zusammenfassung
      parameters:
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Zusammenfassung
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/hours-balance:
    get:
      operationId: getHoursBalance
      tags: [dashboard]
      summary: Soll/Ist-Stunden-Abgleich
      parameters:
        - name: month
          in: query
          schema:
            type: integer
        - name: year
          in: query
          schema:
            type: integer
        - name: teamId
          in: query
          description: Optionaler Team-Kontext für die Datentrennung.
          schema:
            type: integer
      responses:
        "200":
          description: Stundenbilanz
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HoursBalance"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Anmelden
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Erfolgreich angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Falsche Zugangsdaten

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Abmelden
      responses:
        "200":
          description: Abgemeldet

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Aktuell eingeloggter Benutzer
      responses:
        "200":
          description: Eingeloggter Benutzer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Nicht angemeldet

  /auth/set-password:
    post:
      operationId: setPassword
      tags: [auth]
      summary: Passwort über Einladungstoken setzen
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordInput"
      responses:
        "200":
          description: Passwort gesetzt und angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Ungültiger oder abgelaufener Token

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Eigenes Passwort ändern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "200":
          description: Passwort geändert
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
        "400":
          description: Ungültige Eingabe
        "401":
          description: Aktuelles Passwort falsch oder nicht angemeldet

  /auth/update-profile:
    post:
      operationId: updateProfile
      tags: [auth]
      summary: Eigenen Namen und E-Mail ändern
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: Profil aktualisiert
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Ungültige Eingabe
        "401":
          description: Nicht angemeldet
        "409":
          description: E-Mail bereits vergeben

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Neues Konto registrieren
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Konto erstellt und angemeldet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Ungültige Eingabe
        "409":
          description: E-Mail bereits vergeben

  /operator/accounts:
    get:
      operationId: listOperatorAccounts
      tags: [operator]
      summary: Alle Konten plattformweit auflisten (nur superadmin)
      description: >
        Liefert alle Admin-Konten (Assistenznehmer/Dienstleister) mit
        Aggregaten (Team- und Assistenten-Anzahl) für das Operator-Dashboard.
      responses:
        "200":
          description: Liste der Konten
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorAccount"
        "403":
          description: Keine Berechtigung (kein superadmin)

  /operator/accounts/{id}/plan:
    patch:
      operationId: updateOperatorAccountPlan
      tags: [operator]
      summary: Plan eines Kontos manuell umschalten (nur superadmin)
      description: >
        Manuelle Premium-Freischaltung bzw. Rückstufung nach bestätigtem
        Zahlungseingang. Wirkung ist sofort, da die Plan-Durchsetzung den Plan
        pro Request frisch aus der Datenbank liest.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperatorPlanUpdate"
      responses:
        "200":
          description: Aktualisiertes Konto
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperatorAccount"
        "403":
          description: Keine Berechtigung (kein superadmin)
        "404":
          description: Konto nicht gefunden

  /operator/plan-changes:
    get:
      operationId: listOperatorPlanChanges
      tags: [operator]
      summary: Audit-Log der Plan-Umschaltungen (nur superadmin)
      description: >
        Liefert die letzten manuellen Plan-Änderungen (Premium-Freischaltungen
        und Rückstufungen) mit betroffenem Konto, altem/neuem Plan,
        ausführendem Superadmin und Zeitstempel — neueste zuerst.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Liste der Plan-Änderungen (neueste zuerst)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OperatorPlanChange"
        "403":
          description: Keine Berechtigung (kein superadmin)

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    User:
      type: object
      required: [id, name, email, role, accountType, plan, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, assistant, superadmin]
        accountType:
          type: string
          enum: [privat, dienstleister]
        plan:
          type: string
          enum: [free, premium]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        socialSecurityNumber:
          type: ["string", "null"]
        taxId:
          type: ["string", "null"]
        taxClass:
          type: ["string", "null"]
        healthInsurance:
          type: ["string", "null"]
        iban:
          type: ["string", "null"]
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    OperatorAccount:
      type: object
      required: [id, name, email, accountType, plan, teams, assistants, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        accountType:
          type: string
          enum: [privat, dienstleister]
        plan:
          type: string
          enum: [free, premium]
        teams:
          type: integer
          description: Anzahl der Teams im Besitz dieses Kontos
        assistants:
          type: integer
          description: Anzahl unterschiedlicher Assistenten in den Teams dieses Kontos
        createdAt:
          type: string
          format: date-time

    OperatorPlanUpdate:
      type: object
      required: [plan]
      properties:
        plan:
          type: string
          enum: [free, premium]

    OperatorPlanChange:
      type: object
      required:
        [id, accountId, accountName, accountEmail, oldPlan, newPlan, changedByName, createdAt]
      properties:
        id:
          type: integer
        accountId:
          type: integer
        accountName:
          type: string
          description: Name des betroffenen Kontos
        accountEmail:
          type: string
        oldPlan:
          type: string
          enum: [free, premium]
        newPlan:
          type: string
          enum: [free, premium]
        changedByName:
          type: string
          description: Name des ausführenden Superadmins
        createdAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [name, email, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, assistant]
        phone:
          type: string
        address:
          type: string
        birthDate:
          type: string
        socialSecurityNumber:
          type: string
        taxId:
          type: string
        taxClass:
          type: string
        healthInsurance:
          type: string
        iban:
          type: string
        isActive:
          type: boolean
        teamId:
          type: integer
          description: Optionales Ziel-Team; der neue Nutzer wird Mitglied dieses Teams. Ohne Angabe das Standard-Team des Erstellers.

    UserUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        accountType:
          type: string
          enum: [privat, dienstleister]
        phone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        birthDate:
          type: ["string", "null"]
        socialSecurityNumber:
          type: ["string", "null"]
        taxId:
          type: ["string", "null"]
        taxClass:
          type: ["string", "null"]
        healthInsurance:
          type: ["string", "null"]
        iban:
          type: ["string", "null"]
        isActive:
          type: boolean

    Team:
      type: object
      required: [id, name, ownerId, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: integer
        createdAt:
          type: string
          format: date-time

    TeamInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TeamUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1

    TeamMember:
      type: object
      required: [id, teamId, userId, name, email, role, teamCount, createdAt]
      properties:
        id:
          type: integer
        teamId:
          type: integer
        userId:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, assistant]
        teamCount:
          type: integer
          description: Anzahl der Teams dieses Dienstleisters, in denen der Nutzer Mitglied ist
        createdAt:
          type: string
          format: date-time

    TeamMemberInput:
      type: object
      required: [userId]
      properties:
        userId:
          type: integer

    Contract:
      type: object
      required: [id, userId, weeklyHours, vacationDays, vacationDaysUsed, startDate, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        weeklyHours:
          type: number
        vacationDays:
          type: integer
        vacationDaysUsed:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    ContractInput:
      type: object
      required: [userId, weeklyHours, vacationDays, startDate]
      properties:
        userId:
          type: integer
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        weeklyHours:
          type: number
          minimum: 0
        vacationDays:
          type: integer
          minimum: 0
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        notes:
          type: string

    ContractUpdate:
      type: object
      properties:
        weeklyHours:
          type: number
          minimum: 0
        vacationDays:
          type: integer
          minimum: 0
        vacationDaysUsed:
          type: integer
          minimum: 0
        endDate:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]

    Shift:
      type: object
      required: [id, userId, startTime, endTime, type, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        type:
          type: string
          enum: [active, standby, night, full_day, vacation, sick, work]
        planningStatus:
          type: string
          description: >-
            Planungsstatus: VORLAEUFIG = Entwurf, ANGEBOTEN = Vorschlag,
            FIX = verbindlich bestätigt.
          enum: [VORLAEUFIG, ANGEBOTEN, FIX]
        shiftModelId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]
        valuedHours:
          type: number
        nightHours:
          type: number
        sundayHours:
          type: number
        holidayHours:
          type: number
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    ShiftInput:
      type: object
      required: [userId, startTime, endTime, type]
      properties:
        userId:
          type: integer
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        type:
          type: string
          enum: [active, standby, night, full_day, vacation, sick, work]
        planningStatus:
          type: string
          description: >-
            Optionaler Planungsstatus (Default FIX): VORLAEUFIG = Entwurf,
            ANGEBOTEN = Vorschlag, FIX = verbindlich bestätigt.
          enum: [VORLAEUFIG, ANGEBOTEN, FIX]
        shiftModelId:
          type: ["integer", "null"]
        notes:
          type: string

    ShiftUpdate:
      type: object
      properties:
        userId:
          type: integer
          description: >-
            Optionaler Wechsel des zugewiesenen Assistenten. Der neue Nutzer
            muss Mitglied des Teams der Schicht sein (Member-of-Team-Invariante),
            sonst 403. Wird genutzt für das Tauschen des Assistenten beim
            Massen-Ändern bestehender Schichten.
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
        type:
          type: string
          enum: [active, standby, night, full_day, vacation, sick, work]
        planningStatus:
          type: string
          description: >-
            Planungsstatus: VORLAEUFIG = Entwurf, ANGEBOTEN = Vorschlag,
            FIX = verbindlich bestätigt.
          enum: [VORLAEUFIG, ANGEBOTEN, FIX]
        shiftModelId:
          type: ["integer", "null"]
        notes:
          type: ["string", "null"]

    ShiftModel:
      type: object
      required: [id, name, valuationPercent, sortOrder, isActive, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        valuationPercent:
          type: integer
        sortOrder:
          type: integer
        isActive:
          type: boolean
        createdAt:
          type: string
          format: date-time

    ShiftModelInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        valuationPercent:
          type: integer
          minimum: 0
        color:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean

    ShiftModelUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        valuationPercent:
          type: integer
          minimum: 0
        color:
          type: string
        sortOrder:
          type: integer
        isActive:
          type: boolean

    ShiftTemplate:
      type: object
      required: [id, name, startTime, endTime, weekdays, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        startTime:
          type: string
          description: Startzeit im Format "HH:MM".
        endTime:
          type: string
          description: Endzeit im Format "HH:MM".
        weekdays:
          type: array
          description: Gültige Wochentage, 1 (Montag) bis 7 (Sonntag).
          items:
            type: integer
            minimum: 1
            maximum: 7
        createdAt:
          type: string
          format: date-time

    ShiftTemplateInput:
      type: object
      required: [name, startTime, endTime]
      properties:
        name:
          type: string
          minLength: 1
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7

    ShiftTemplateUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        startTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        endTime:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        weekdays:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 7

    AllowanceSettings:
      type: object
      required:
        [
          id,
          nightPercent,
          nightStart,
          nightEnd,
          sundayPercent,
          holidayPercent,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        nightPercent:
          type: integer
        nightStart:
          type: string
        nightEnd:
          type: string
        sundayPercent:
          type: integer
        holidayPercent:
          type: integer
        state:
          type: ["string", "null"]
          enum: [BW, BY, BE, BB, HB, HH, HE, MV, NI, NW, RP, SL, SN, ST, SH, TH, null]
        updatedAt:
          type: string
          format: date-time

    AllowanceSettingsInput:
      type: object
      required: [nightPercent, nightStart, nightEnd, sundayPercent, holidayPercent]
      properties:
        nightPercent:
          type: integer
          minimum: 0
          maximum: 100
        nightStart:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        nightEnd:
          type: string
          pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
        sundayPercent:
          type: integer
          minimum: 0
          maximum: 100
        holidayPercent:
          type: integer
          minimum: 0
          maximum: 100
        state:
          type: ["string", "null"]
          enum: [BW, BY, BE, BB, HB, HH, HE, MV, NI, NW, RP, SL, SN, ST, SH, TH, null]

    BrandingSettings:
      type: object
      required: [id, updatedAt]
      properties:
        id:
          type: integer
        logoPath:
          type: ["string", "null"]
          description: Object-Storage-Pfad des hochgeladenen Logos (z.B. `/objects/uploads/uuid`) oder null.
        updatedAt:
          type: string
          format: date-time

    BrandingSettingsInput:
      type: object
      properties:
        logoPath:
          type: ["string", "null"]
          description: Object-Storage-Pfad des hochgeladenen Logos oder null zum Entfernen.
        teamId:
          type: integer
          description: Optionaler Team-Kontext; setzt das teamspezifische Logo statt des globalen.

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
          description: Original file name.
        size:
          type: integer
          minimum: 1
          description: File size in bytes.
        contentType:
          type: string
          minLength: 1
          description: MIME type of the file (e.g. `image/jpeg`).
    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
          description: Presigned GCS URL for PUT upload.
        objectPath:
          type: string
          description: Normalized object path (e.g. `/objects/uploads/uuid`). Store this in your database.
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string

    TimeEntry:
      type: object
      required: [id, userId, shiftId, actualStart, actualEnd, status, createdAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        shiftId:
          type: ["integer", "null"]
        actualStart:
          type: string
          format: date-time
        actualEnd:
          type: string
          format: date-time
        actualHours:
          type: number
        status:
          type: string
          enum: [pending, confirmed, rejected]
        notes:
          type: ["string", "null"]
        confirmedBy:
          type: ["integer", "null"]
        confirmedAt:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/User"

    TimeEntryInput:
      type: object
      required: [userId, actualStart, actualEnd]
      properties:
        userId:
          type: integer
        teamId:
          type: integer
          description: Optionaler Team-Kontext; muss ein erlaubtes Team sein.
        shiftId:
          type: integer
        actualStart:
          type: string
          format: date-time
        actualEnd:
          type: string
          format: date-time
        notes:
          type: string

    TimeEntryUpdate:
      type: object
      properties:
        actualStart:
          type: string
          format: date-time
        actualEnd:
          type: string
          format: date-time
        notes:
          type: ["string", "null"]

    TimeEntryConfirm:
      type: object
      required: [status, confirmedBy]
      properties:
        status:
          type: string
          enum: [confirmed, rejected]
        confirmedBy:
          type: integer
        notes:
          type: string

    TimeEntryConfirmBatch:
      type: object
      required: [ids, confirmedBy]
      properties:
        ids:
          type: array
          description: IDs der zu bestätigenden offenen Zeiteinträge.
          items:
            type: integer
          minItems: 1
          maxItems: 500
        confirmedBy:
          type: integer

    TimeEntryConfirmBatchResult:
      type: object
      required: [confirmedCount]
      properties:
        confirmedCount:
          type: integer
          description: Anzahl der tatsächlich bestätigten (zuvor offenen) Einträge.

    CalendarToken:
      type: object
      required: [token, feedPath]
      properties:
        token:
          type: string
          nullable: true
          description: Geheimer Abo-Token (null = kein Abo eingerichtet)
        feedPath:
          type: string
          nullable: true
          description: Relativer Pfad der Feed-URL (null = kein Abo eingerichtet)

    InviteResult:
      type: object
      required: [userId, userName, inviteUrl, token, expiresIn, note]
      properties:
        userId:
          type: integer
        userName:
          type: string
        inviteUrl:
          type: string
        token:
          type: string
        expiresIn:
          type: string
        note:
          type: string

    DashboardSummary:
      type: object
      required: [totalAssistants, activeShiftsToday, pendingTimeEntries, monthlyPlannedHours, monthlyActualHours]
      properties:
        totalAssistants:
          type: integer
        activeShiftsToday:
          type: integer
        pendingTimeEntries:
          type: integer
        monthlyPlannedHours:
          type: number
        monthlyActualHours:
          type: number
        hoursBalance:
          type: number
        uncountedPendingHours:
          type: number
          description: >-
            Summe der Ist-Stunden offener (pending) Einträge im Monat, die wegen
            strikter Zählung (Premium-Team-Eigentümer) NICHT in monthlyActualHours
            einfließen. In Free-Teams zählen offene Einträge mit, dort ist der
            Wert 0. Nach einem Upgrade macht dieser Wert sichtbar, welche zuvor
            gezählten Stunden erst nach Bestätigung wieder erscheinen.
        uncountedPendingEntries:
          type: integer
          description: Anzahl der offenen Einträge hinter uncountedPendingHours.
        upcomingShifts:
          type: array
          items:
            $ref: "#/components/schemas/Shift"
        recentTimeEntries:
          type: array
          items:
            $ref: "#/components/schemas/TimeEntry"
        warnings:
          $ref: "#/components/schemas/DashboardWarnings"

    DashboardWarnings:
      type: object
      required: [pendingTimeEntries, timeTrackingConfirmable, lowVacationAssistants, uncoveredDays, lowVacationThreshold, horizonDays]
      properties:
        pendingTimeEntries:
          type: integer
          description: Anzahl noch nicht bestätigter Zeiterfassungen
        timeTrackingConfirmable:
          type: boolean
          description: >-
            Ob im aktuellen Team-Scope überhaupt ein Freigabe-Workflow existiert
            (mindestens ein Team mit strictTimeTracking, d. h. Premium-Eigentümer).
            Bei false ist "offen" der Normalzustand (Free) — das Frontend zeigt
            offene Zeiterfassungen dann nicht als To-do-Warnung an.
        lowVacationAssistants:
          type: array
          items:
            $ref: "#/components/schemas/LowVacationAssistant"
        uncoveredDays:
          type: array
          description: Kommende Tage ohne geplante Schicht (ISO-Datum)
          items:
            type: string
            format: date
        lowVacationThreshold:
          type: integer
          description: Schwelle (Resturlaubstage), ab der gewarnt wird
        horizonDays:
          type: integer
          description: Vorausschau-Zeitraum in Tagen für unbesetzte Tage

    LowVacationAssistant:
      type: object
      required: [userId, userName, vacationDaysRemaining]
      properties:
        userId:
          type: integer
        userName:
          type: string
        vacationDaysRemaining:
          type: integer

    HoursBalance:
      type: object
      required: [userId, userName, plannedHours, actualHours, balance, workedHours, sickHours, vacationDaysTaken, vacationDaysUsed, vacationDaysRemaining, valuedHours, vacationFulfilledHours, totalFulfilledHours, nightHours, nightSurchargeHours, sundayHours, sundaySurchargeHours, holidayHours, holidaySurchargeHours, nightPercent, sundayPercent, holidayPercent]
      properties:
        userId:
          type: integer
        userName:
          type: string
        plannedHours:
          type: number
        actualHours:
          type: number
        balance:
          type: number
        workedHours:
          type: number
        sickHours:
          type: number
        vacationDaysTaken:
          type: integer
          description: Genommene Urlaubstage des gewählten Monats (Anzahl der Urlaubs-Schichten in diesem Monat).
        vacationDaysUsed:
          type: integer
          description: Im Vertrag gespeicherter Jahres-Zähler der genommenen Urlaubstage.
        vacationDaysRemaining:
          type: integer
        valuedHours:
          type: number
        vacationFulfilledHours:
          type: number
        totalFulfilledHours:
          type: number
        nightHours:
          type: number
        nightSurchargeHours:
          type: number
        sundayHours:
          type: number
        sundaySurchargeHours:
          type: number
        holidayHours:
          type: number
        holidaySurchargeHours:
          type: number
        nightPercent:
          type: integer
        sundayPercent:
          type: integer
        holidayPercent:
          type: integer

    VacationBalance:
      type: object
      required: [contractId, userId, vacationDays, vacationDaysUsed, vacationDaysRemaining]
      properties:
        contractId:
          type: integer
        userId:
          type: integer
        vacationDays:
          type: integer
        vacationDaysUsed:
          type: integer
        vacationDaysRemaining:
          type: integer

    AuthUser:
      type: object
      required: [id, name, email, role, accountType, plan]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [admin, assistant, superadmin]
        accountType:
          type: string
          enum: [privat, dienstleister]
        plan:
          type: string
          enum: [free, premium]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    SetPasswordInput:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 8

    ChangePasswordInput:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          minLength: 8

    UpdateProfileInput:
      type: object
      required: [name, email]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email

    RegisterInput:
      type: object
      required: [name, email, password, accountType]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        accountType:
          type: string
          enum: [privat, dienstleister]
