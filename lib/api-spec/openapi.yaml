          description: Zeiterfassung aktivieren/deaktivieren (konto-global, kein Team-Override).
        vacationMethod:
          type: string
          enum: [bwavg, factor]
        vacationHoursPerDay:
          type: number
          minimum: 0.1
        vacationFactor:
          type: number
          minimum: 0
        ersatzruhetagEnabled:
          type: boolean
          description: Ersatzruhetag-Konto (§ 11 Abs. 3 ArbZG) aktivieren/deaktivieren.
        teamMeetingEnabled:
          type: boolean
          description: Team-Dienst (Teamsitzung) aktivieren/deaktivieren (konto-global, kein Team-Override).
        teamMeetingHours:
          type: number
          minimum: 0.1
          description: Gutgeschriebene Stunden je Teamsitzung und Assistenzkraft.
        pauseAutoEnabled:
          type: boolean
          description: Automatische Pausen-Vorbefüllung aktivieren/deaktivieren (konto-global, kein Team-Override).
        pauseThreshold1Hours:
          type: number
          minimum: 0.1
          description: Ab dieser Dienstdauer (Stunden) gilt Pausen-Stufe 1.
        pauseMinutes1:
          type: integer
          minimum: 0
          maximum: 1440
          description: Pausenminuten der Stufe 1.
        pauseThreshold2Hours:
          type: number
          minimum: 0.1
          description: Ab dieser Dienstdauer (Stunden) gilt Pausen-Stufe 2.
        pauseMinutes2:
          type: integer
          minimum: 0
          maximum: 1440
          description: Pausenminuten der Stufe 2.
        deductPausesEnabled:
          type: boolean
          description: >-
            Pausen von den bezahlten Stunden abziehen (konto-global, kein
            Team-Override).

    TimeTrackingStatus:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: >-
            true, wenn die Zeiterfassung für den angemeldeten Nutzer effektiv
            aktiv ist (Admin = eigene Konto-Einstellung, Assistenzkraft =
            mindestens ein Team-Eigentümer hat sie aktiviert).
        pauseRule:
          type: object
          description: >-
            Effektive Pausenregelung für den angemeldeten Nutzer (Admin =
            eigene Konto-Einstellung, Assistenzkraft = Regel des ersten
            Team-Eigentümers mit aktivierter Vorbefüllung). Dient der
            Vorbefüllung des Pausenfelds im Zeiterfassungs-Dialog.
          required:
            [
              pauseAutoEnabled,
              pauseThreshold1Hours,
              pauseMinutes1,
              pauseThreshold2Hours,
              pauseMinutes2,
            ]
          properties:
            pauseAutoEnabled:
              type: boolean
            pauseThreshold1Hours:
              type: number
            pauseMinutes1:
              type: integer
            pauseThreshold2Hours:
              type: number
            pauseMinutes2:
              type: integer

    BrandingSettings:
      type: object
