kind = "web"
previewPath = "/"
title = "Dienstplan-App"
version = "1.0.0"
id = "artifacts/dienstplan"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20361

[services.development]
run = "pnpm --filter @workspace/dienstplan run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dienstplan", "run", "build" ]
# Statische Dateien werden vom API-Server (Express) ausgeliefert — kein
# eigener Static-Handler mehr, damit SPA-Deep-Links zuverlässig funktionieren.

[services.env]
PORT = "20361"
BASE_PATH = "/"
